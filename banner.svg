<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="380" viewBox="0 0 1660 380" role="img" aria-label="Anivesh91">
  <title>Anivesh91 - Dark Mode Banner</title>
  
  <style>
    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-1660px); }
    }
    .drift { animation: drift 7s linear infinite; }
    .drift-slow { animation: drift 13s linear infinite; }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.45; }
    }
    .motion-only { animation: pulse-glow 3s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <!-- Dark Vignette Background -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset=".55" stop-color="#0a0f1d" stop-opacity="0"/>
      <stop offset="1" stop-color="#020408" stop-opacity="0.75"/>
    </radialGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="phosphor" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip Paths -->
    <clipPath id="screen">
      <rect x="20" y="20" width="1620" height="340" rx="18"/>
    </clipPath>
    <clipPath id="icon">
      <rect x="76" y="114" width="152" height="152" rx="24"/>
    </clipPath>

    <!-- Scrim to fade waves smoothly behind text -->
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0f1d" stop-opacity="0.95"/>
      <stop offset="0.62" stop-color="#0a0f1d" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0a0f1d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect width="1660" height="380" rx="24" fill="#050811" stroke="#1a2333" stroke-width="2"/>

  <!-- Screen Content -->
  <g clip-path="url(#screen)">
    <rect x="20" y="20" width="1620" height="340" fill="#0a0f1d"/>

    <!-- Dark Blueprint Technical Grid -->
    <g stroke="rgba(0, 240, 255, 0.08)" stroke-width="1.5" stroke-dasharray="2 8">
      <line x1="182" x2="182" y1="20" y2="360"/>
      <line x1="344" x2="344" y1="20" y2="360"/>
      <line x1="506" x2="506" y1="20" y2="360"/>
      <line x1="668" x2="668" y1="20" y2="360"/>
      <line x1="830" x2="830" y1="20" y2="360"/>
      <line x1="992" x2="992" y1="20" y2="360"/>
      <line x1="1154" x2="1154" y1="20" y2="360"/>
      <line x1="1316" x2="1316" y1="20" y2="360"/>
      <line x1="1478" x2="1478" y1="20" y2="360"/>
      <line y1="105" y2="105" x1="20" x2="1640"/>
      <line y1="190" y2="190" x1="20" x2="1640"/>
      <line y1="275" y2="275" x1="20" x2="1640"/>
    </g>

    <!-- Center Amplitude Axis with Ticks -->
    <g stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5">
      <line x1="20" x2="1640" y1="190" y2="190"/>
    </g>

    <!-- Secondary Wave: Neon Violet / Purple -->
    <g class="drift-slow" opacity="0.65">
      <path d="M0 190 Q 207.5 110, 415 190 T 830 190 T 1245 190 T 1660 190 T 2075 190 T 2490 190 T 2905 190 T 3320 190" 
            fill="none" stroke="#bd00ff" stroke-width="2.5"/>
    </g>

    <!-- Primary Wave: Electric Cyan with Neon Glow -->
    <g class="drift" filter="url(#phosphor)">
      <path d="M0 190 Q 138 90, 276 190 T 552 190 T 828 190 T 1104 190 T 1380 190 T 1656 190 T 1932 190 T 2208 190 T 2484 190 T 2760 190 T 3036 190 T 3320 190" 
            fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-linejoin="round"/>
    </g>

    <!-- Overlays -->
    <rect x="20" y="20" width="1620" height="340" fill="url(#vignette)"/>
    <rect width="1095" height="380" fill="url(#scrim)"/>
  </g>

  <!-- Inner Screen Border -->
  <rect x="21" y="21" width="1618" height="338" rx="18" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Channel Telemetry -->
  <text x="44" y="56" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#00f0ff">CH1</text>

  <!-- Avatar Image (GitHub Profile) -->
  <rect x="74" y="112" width="156" height="156" rx="26" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>
  <image href="https://github.com/Anivesh91.png" x="76" y="114" width="152" height="152" preserveAspectRatio="xMidYMid slice" clip-path="url(#icon)"/>

  <!-- Main Username Title -->
  <text x="272" y="182.8" font-family="'Nova Square', system-ui, sans-serif" font-size="100" font-weight="700" fill="#f8fafc">Anivesh91</text>

  <!-- Handle Pill Badge -->
  <rect x="272" y="228.5" width="218" height="53" rx="26.5" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.5)" stroke-width="2"/>
  <text x="291" y="265.8" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="500" fill="#00f0ff">@Anivesh91</text>
</svg>
