<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="380" viewBox="0 0 1660 380" role="img" aria-label="Anivesh91 Banner">
  <title>Anivesh91 - Developer Profile Banner</title>
  
  <style>
    @keyframes wave-fast {
      0% { transform: translateX(0); }
      100% { transform: translateX(-830px); }
    }
    @keyframes wave-slow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-830px); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.8)); }
      50% { opacity: 0.45; filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.4)); }
    }
    @keyframes live-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes scan-beam {
      0% { transform: translateX(-1660px); }
      100% { transform: translateX(1660px); }
    }

    .wave-cyan {
      animation: wave-fast 9s linear infinite;
    }
    .wave-purple {
      animation: wave-slow 16s linear infinite;
    }
    .live-dot {
      animation: live-blink 1.8s ease-in-out infinite;
    }
    .scanner {
      animation: scan-beam 6s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .wave-cyan, .wave-purple, .live-dot, .scanner {
        animation: none !important;
      }
    }
  </style>

  <defs>
    <!-- Background Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="30%" stop-color="#0a0f1d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030509" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon Cyan Glow Filter -->
    <filter id="neon-glow-cyan" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Purple Glow Filter -->
    <filter id="neon-glow-purple" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Paths -->
    <clipPath id="screen-clip">
      <rect x="18" y="18" width="1624" height="344" rx="20"/>
    </clipPath>
    <clipPath id="avatar-clip">
      <rect x="76" y="114" width="152" height="152" rx="28"/>
    </clipPath>

    <!-- Scrim to fade waves behind text -->
    <linearGradient id="text-scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#070b14" stop-opacity="0.95"/>
      <stop offset="48%" stop-color="#070b14" stop-opacity="0.82"/>
      <stop offset="75%" stop-color="#070b14" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </linearGradient>

    <!-- Scanline Beam Gradient -->
    <linearGradient id="scanline-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="rgba(0, 240, 255, 0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect width="1660" height="380" rx="26" fill="#030509" stroke="#1a2333" stroke-width="2"/>

  <!-- Screen Content -->
  <g clip-path="url(#screen-clip)">
    <!-- Base Dark Screen Background -->
    <rect x="18" y="18" width="1624" height="344" fill="url(#vignette)"/>

    <!-- Technical Oscilloscope Grid -->
    <g stroke="rgba(0, 240, 255, 0.07)" stroke-width="1.2" stroke-dasharray="2 6">
      <line x1="182" x2="182" y1="18" y2="362"/>
      <line x1="344" x2="344" y1="18" y2="362"/>
      <line x1="506" x2="506" y1="18" y2="362"/>
      <line x1="668" x2="668" y1="18" y2="362"/>
      <line x1="830" x2="830" y1="18" y2="362"/>
      <line x1="992" x2="992" y1="18" y2="362"/>
      <line x1="1154" x2="1154" y1="18" y2="362"/>
      <line x1="1316" x2="1316" y1="18" y2="362"/>
      <line x1="1478" x2="1478" y1="18" y2="362"/>
      
      <line x1="18" x2="1642" y1="80" y2="80"/>
      <line x1="18" x2="1642" y1="135" y2="135"/>
      <line x1="18" x2="1642" y1="245" y2="245"/>
      <line x1="18" x2="1642" y1="300" y2="300"/>
    </g>

    <!-- Center Amplitude Axis with Precision Ticks -->
    <g stroke="rgba(0, 240, 255, 0.22)" stroke-width="1.5">
      <line x1="18" x2="1642" y1="190" y2="190"/>
      <!-- Axis cross-ticks -->
      <path d="M100 184v12 M182 184v12 M264 184v12 M344 184v12 M426 184v12 M506 184v12 M588 184v12 M668 184v12 M750 184v12 M830 184v12 M912 184v12 M992 184v12 M1074 184v12 M1154 184v12 M1236 184v12 M1316 184v12 M1398 184v12 M1478 184v12 M1560 184v12" stroke-width="1.5"/>
    </g>

    <!-- Laser Scanner Sweep Effect -->
    <rect class="scanner" x="18" y="18" width="200" height="344" fill="url(#scanline-grad)"/>

    <!-- WAVE LAYER 1: Deep Violet / Magenta Harmonic (Secondary Wave) -->
    <g class="wave-purple" filter="url(#neon-glow-purple)" opacity="0.6">
      <path d="M0 190 Q 103.75 110, 207.5 190 T 415 190 T 622.5 190 T 830 190 T 1037.5 190 T 1245 190 T 1452.5 190 T 1660 190 T 1867.5 190 T 2075 190 T 2282.5 190 T 2490 190" 
            fill="none" stroke="#bd00ff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- WAVE LAYER 2: Electric Cyan Signal (Primary Oscilloscope Wave) -->
    <g class="wave-cyan" filter="url(#neon-glow-cyan)">
      <!-- Smooth modulated waveform pattern -->
      <path d="M0 190 C 50 120, 100 120, 150 190 S 250 260, 300 190 S 370 70, 440 190 S 530 310, 600 190 S 700 150, 770 190 S 830 220, 890 190 S 950 100, 1020 190 S 1100 280, 1170 190 S 1250 140, 1320 190 S 1400 240, 1470 190 S 1550 90, 1620 190 S 1700 290, 1770 190 S 1850 130, 1920 190 S 2000 250, 2070 190 S 2150 100, 2220 190 S 2300 280, 2370 190 S 2450 140, 2520 190" 
            fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Scrim to make text 100% readable over waveform -->
    <rect x="18" y="18" width="1150" height="344" fill="url(#text-scrim)"/>

    <!-- Corner HUD Accents -->
    <g font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="14" fill="#00f0ff" font-weight="600" letter-spacing="2">
      <!-- Live Status -->
      <circle class="live-dot" cx="44" cy="50" r="5" fill="#00ff9d" filter="drop-shadow(0 0 6px #00ff9d)"/>
      <text x="60" y="55" fill="#00ff9d">LIVE SIGNAL</text>
      <text x="210" y="55" fill="rgba(255,255,255,0.4)">//</text>
      <text x="235" y="55" fill="rgba(0,240,255,0.85)">CH-1 [100MHz 2.5V/DIV]</text>
      
      <!-- Top Right Telemetry -->
      <text x="1450" y="55" fill="rgba(255, 255, 255, 0.45)" text-anchor="start">SYS::STABLE</text>
    </g>

    <!-- Stylized Avatar / Logo Container -->
    <g transform="translate(0, 0)">
      <!-- Avatar Outer Hexagon / Glow Box -->
      <rect x="76" y="114" width="152" height="152" rx="28" fill="#0f172a" stroke="#00f0ff" stroke-width="2.5" filter="drop-shadow(0 0 10px rgba(0, 240, 255, 0.35))"/>
      
      <!-- Tech Developer Symbol inside Avatar -->
      <g stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Stylized Terminal Bracket & Slash -->
        <path d="M 120 162 L 102 190 L 120 218" />
        <path d="M 184 162 L 202 190 L 184 218" />
        <path d="M 160 156 L 144 224" stroke="#bd00ff" stroke-width="4.5" />
      </g>
    </g>

    <!-- Main Title: Anivesh91 -->
    <text x="272" y="186" 
          font-family="'Nova Square', 'Space Grotesk', system-ui, sans-serif" 
          font-size="94" 
          font-weight="800" 
          letter-spacing="1.5" 
          fill="#f8fafc" 
          filter="drop-shadow(0 0 18px rgba(0, 240, 255, 0.25))">Anivesh91</text>

    <!-- Handle Badge Pill -->
    <g transform="translate(272, 224)">
      <!-- Pill Shape -->
      <rect x="0" y="0" width="230" height="50" rx="25" 
            fill="rgba(0, 240, 255, 0.08)" 
            stroke="rgba(0, 240, 255, 0.5)" 
            stroke-width="1.8" 
            filter="drop-shadow(0 0 8px rgba(0, 240, 255, 0.2))"/>
      <!-- Text inside Pill -->
      <text x="115" y="34" 
            font-family="'JetBrains Mono', 'Fira Code', monospace" 
            font-size="24" 
            font-weight="600" 
            fill="#00f0ff" 
            text-anchor="middle">@Anivesh91</text>
    </g>

    <!-- Subtitle Role Tag -->
    <text x="525" y="258" 
          font-family="'JetBrains Mono', 'Fira Code', monospace" 
          font-size="20" 
          font-weight="500" 
          fill="rgba(255, 255, 255, 0.65)" 
          letter-spacing="1">| Full Stack Developer &amp; Tech Enthusiast ⚡</text>

    <!-- Bottom Border Accent Line -->
    <line x1="20" x2="1640" y1="358" y2="358" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5"/>
  </g>
</svg>
