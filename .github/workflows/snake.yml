name: Sync Profile Stats & Snake

on:
  # Auto-sync every 4 hours so commits across any repo stay fresh
  schedule:
    - cron: "0 */4 * * *"

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

  # Run immediately on every push to main or master
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.METRICS_TOKEN || github.token }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate live synced GitHub metrics cards
        run: python3 .github/scripts/generate_stats.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          OUT_DIR: dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Push snake & synced stats SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
